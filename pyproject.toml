[project]
name = "cpyc_buildtools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
]

[project.urls]
Repository = "https://github.com"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpyc_buildtools = ["templates/*", "templates/**/*"]

[project.scripts]
build_cpyc = "cpyc_buildtools.main:main"